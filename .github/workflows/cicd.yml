
name: Automated CI CD Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Automated Tests
        run: |
          python -m pytest -v

      - name: Build Docker Image
        run: |
          docker build -t automated-cicd-app .

      - name: Run Docker Container
        run: |
          docker run -d -p 5000:5000 --name cicd-container automated-cicd-app

      - name: Test Container Health
        run: |
          for i in {1..10}; do
            if curl -fsS http://localhost:5000/health; then
              echo "Container is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "Container health check failed"
          docker logs cicd-container
          exit 1

      - name: Stop Container
        if: always()
        run: docker stop cicd-container || true
